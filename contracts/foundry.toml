# Foundry config for Floor. Monad execution support needs Foundry >= 1.8.0
# (https://docs.monad.xyz/tooling-and-infra/toolkits/foundry).
[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
test = "test"
script = "script"
solc_version = "0.8.30"
# Conservative target: Monad supports EIP-7702 (Prague). Osaka-only opcodes are
# not documented for Monad yet, so we don't emit them. See docs/DECISIONS.md.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# Enables Monad execution semantics (gas, precompiles, reserve balance) in forge/anvil/cast.
network = "monad"
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  # Pyth's Solidity SDK ships on npm only (installed by `pnpm install`).
  "@pythnetwork/pyth-sdk-solidity/=node_modules/@pythnetwork/pyth-sdk-solidity/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64

[fmt]
line_length = 100

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
monad_mainnet = "${MONAD_MAINNET_RPC_URL}"
